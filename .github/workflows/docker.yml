name: docker
on:
  push:
    tags:
      - v*
    branches:
      - master
# The jobs only read the repository. The registries take their own secrets, and
# the digest artifacts use the runner's token, not this one.
permissions:
  contents: read
# No job reads or writes the GitHub Actions cache. The images are built from
# scratch, so nothing another workflow saved in the cache can end up in them.
cache-mode: none
# One run per ref at a time, so an older run of a ref cannot move its tags
# (`master`, the staging tag) after a newer one. A queued run gives way to a
# newer run of the same ref; a running one is never cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Each platform is built on a native runner. Building arm64 under QEMU
  # emulation crashed with SIGILL during `npm install` on v0.42.0-rc.1.
  # The build jobs push their image by digest only, without tags. The merge
  # job then tags one multi-platform image from those digests.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      # https://github.com/actions/checkout/releases/tag/v4.1.7
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      with:
        # No step runs git after the checkout, so the token is not kept on disk
        persist-credentials: false
    - name: Prepare tags
      id: tags
      env:
        AWS_ECR_URL: ${{ secrets.AWS_ECR_URL }}
      run: python3 scripts/github/docker.py
    - name: Prepare image names
      id: names
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      # The repositories to push to: every tag with its `:tag` suffix removed
      run: |
        echo "names=$(echo "$TAGS" | tr ',' '\n' | sed -E 's/:[^:/]+$//' | sort -u | paste -sd, -)" >> "$GITHUB_OUTPUT"
    - name: Set up Docker Buildx
      # https://github.com/docker/setup-buildx-action/releases/tag/v3.6.1
      uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
    - name: Login to DockerHub
      # https://github.com/docker/login-action/releases/tag/v3.3.0
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to AWS ECR
      # https://github.com/docker/login-action/releases/tag/v3.3.0
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
          registry: ${{ secrets.AWS_ECR_URL}}
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Build and push by digest
      id: build
      # https://github.com/docker/build-push-action/releases/tag/v6.15.0
      uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
      with:
        platforms: ${{ matrix.platform }}
        outputs: type=image,"name=${{ steps.names.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
    - name: Build and push RabbitMQ image by digest
      id: build-rabbitmq
      # https://github.com/docker/build-push-action/releases/tag/v6.15.0
      uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
      if: steps.tags.outputs.rabbitmq_tags != ''
      with:
        build-args:
          ENABLE_RABBITMQ=true
        platforms: ${{ matrix.platform }}
        outputs: type=image,"name=${{ steps.names.outputs.names }}",push-by-digest=true,name-canonical=true,push=true
    - name: Export digests
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        RABBITMQ_DIGEST: ${{ steps.build-rabbitmq.outputs.digest }}
      run: |
        if [ -z "$DIGEST" ]; then
          echo "The build step returned no image digest"
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/digests/main" "$RUNNER_TEMP/digests/rabbitmq"
        touch "$RUNNER_TEMP/digests/main/${DIGEST#sha256:}"
        if [ -n "$RABBITMQ_DIGEST" ]; then
          touch "$RUNNER_TEMP/digests/rabbitmq/${RABBITMQ_DIGEST#sha256:}"
        fi
    - name: Upload digests
      # https://github.com/actions/upload-artifact/releases/tag/v4.3.6
      uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
      with:
        name: digests-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests
        if-no-files-found: error
        retention-days: 1
        # A rerun of this job must be able to replace the artifact of the failed attempt
        overwrite: true

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      # https://github.com/actions/checkout/releases/tag/v4.1.7
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      with:
        # No step runs git after the checkout, so the token is not kept on disk
        persist-credentials: false
    - name: Prepare tags
      id: tags
      env:
        AWS_ECR_URL: ${{ secrets.AWS_ECR_URL }}
      run: python3 scripts/github/docker.py
    - name: Download digests
      # https://github.com/actions/download-artifact/releases/tag/v8.0.2
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-*
        merge-multiple: true
    - name: Set up Docker Buildx
      # https://github.com/docker/setup-buildx-action/releases/tag/v3.6.1
      uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db
    - name: Login to DockerHub
      # https://github.com/docker/login-action/releases/tag/v3.3.0
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Login to AWS ECR
      # https://github.com/docker/login-action/releases/tag/v3.3.0
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
          registry: ${{ secrets.AWS_ECR_URL}}
          username: ${{ secrets.AWS_ACCESS_KEY_ID }}
          password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Create and push the multi-platform images
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
        RABBITMQ_TAGS: ${{ steps.tags.outputs.rabbitmq_tags }}
      run: |
        set -euo pipefail
        # Each image needs one digest per platform of the build matrix
        platforms=2

        # Fails unless an image has one digest per platform. Every image is
        # checked before any tag moves, so a missing platform cannot publish a
        # single-platform image or half a release.
        check_digests() {
          local tags="$1" dir="$2"
          if [ -z "$tags" ]; then
            return 0
          fi
          local digests
          digests=$(ls "$dir" 2>/dev/null || true)
          if [ "$(echo "$digests" | wc -w)" -ne "$platforms" ]; then
            echo "Expected $platforms platform digests in $dir, found: ${digests:-none}"
            exit 1
          fi
        }

        # Tags one multi-platform image per repository, from the digests the
        # build jobs pushed to that same repository
        published=()
        create_images() {
          local tags="$1" dir="$2"
          if [ -z "$tags" ]; then
            return 0
          fi
          local digests
          digests=$(ls "$dir")
          for repo in $(echo "$tags" | tr ',' '\n' | sed -E 's/:[^:/]+$//' | sort -u); do
            local args=()
            for tag in $(echo "$tags" | tr ',' '\n'); do
              if [ "${tag%:*}" = "$repo" ]; then
                args+=(-t "$tag")
              fi
            done
            for digest in $digests; do
              args+=("$repo@sha256:$digest")
            done
            docker buildx imagetools create "${args[@]}"
            published+=("${args[1]}")
          done
        }

        check_digests "$TAGS" "$RUNNER_TEMP/digests/main"
        check_digests "$RABBITMQ_TAGS" "$RUNNER_TEMP/digests/rabbitmq"
        create_images "$TAGS" "$RUNNER_TEMP/digests/main"
        create_images "$RABBITMQ_TAGS" "$RUNNER_TEMP/digests/rabbitmq"
        # A report only: every tag is in place by now, so a failed read must not
        # fail the job
        for image in "${published[@]}"; do
          docker buildx imagetools inspect "$image" || echo "::warning::Could not inspect $image"
        done
